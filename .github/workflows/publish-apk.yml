name: Build and Publish Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      app_name:
        description: 'Android application display name'
        required: false
        default: 'RetroEX'
      app_id:
        description: 'Android package ID'
        required: false
        default: 'app.retroex.tv'
      server_url:
        description: 'Optional RetroEX backend base URL for APK API calls'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install dependencies and build web bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.server_url || '' }}
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Package Android & TV project with Capacitor
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'RetroEX' }}
          APP_ID: ${{ github.event.inputs.app_id || 'app.retroex.tv' }}
        run: |
          rm -rf android capacitor.config.json capacitor.config.ts
          npm install --no-save --legacy-peer-deps @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
          node -e '
            const fs = require("fs");
            fs.writeFileSync("capacitor.config.json", JSON.stringify({
              appId: process.env.APP_ID || "app.retroex.tv",
              appName: process.env.APP_NAME || "RetroEX",
              webDir: "dist",
              android: { allowMixedContent: true }
            }, null, 2));
          '
          npx cap add android
          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            if (!xml.includes("android:usesCleartextTraffic")) {
              xml = xml.replace("<application", "<application\n        android:usesCleartextTraffic=\"true\"");
            }
            if (!xml.includes("android:largeHeap")) {
              xml = xml.replace("<application", "<application\n        android:largeHeap=\"true\"\n        android:hardwareAccelerated=\"true\"");
            }
            if (!xml.includes("android.permission.WRITE_EXTERNAL_STORAGE")) {
              xml = xml.replace(
                "<application",
                "<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />\n    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n    <application"
              );
            }
            if (!xml.includes("android.software.leanback")) {
              xml = xml.replace(
                "<application",
                "<uses-feature android:name=\"android.software.leanback\" android:required=\"false\" />\n    <uses-feature android:name=\"android.hardware.touchscreen\" android:required=\"false\" />\n    <application"
              );
            }
            if (!xml.includes("android.intent.category.LEANBACK_LAUNCHER")) {
              xml = xml.replace(
                "<category android:name=\"android.intent.category.LAUNCHER\" />",
                "<category android:name=\"android.intent.category.LAUNCHER\" />\n                <category android:name=\"android.intent.category.LEANBACK_LAUNCHER\" />"
              );
            }
            fs.writeFileSync(manifestPath, xml);

            // Inject native Downloads bridge + WebView media/perf settings into MainActivity.java
            const javaRoot = "android/app/src/main/java";
            const findMainActivity = (dir) => {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) {
                  const found = findMainActivity(full);
                  if (found) return found;
                } else if (ent.name === "MainActivity.java") {
                  return full;
                }
              }
              return null;
            };
            const mainActPath = findMainActivity(javaRoot);
            if (mainActPath) {
              const orig = fs.readFileSync(mainActPath, "utf8");
              const pkgMatch = orig.match(/^\s*package\s+([^;]+);/m);
              const pkgName = pkgMatch ? pkgMatch[1] : "app.retroex.tv";
              const javaCode = `package ${pkgName};

import android.content.ContentValues;
import android.net.Uri;
import android.os.Build;
import android.os.Bundle;
import android.os.Environment;
import android.provider.MediaStore;
import android.util.Base64;
import android.webkit.JavascriptInterface;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.widget.Toast;
import com.getcapacitor.BridgeActivity;
import org.json.JSONObject;
import java.io.File;
import java.io.FileInputStream;
import java.io.FileOutputStream;
import java.io.OutputStream;
import java.util.Map;
import java.util.UUID;
import java.util.concurrent.ConcurrentHashMap;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        if (this.bridge != null && this.bridge.getWebView() != null) {
            WebView webView = this.bridge.getWebView();
            WebSettings settings = webView.getSettings();
            settings.setMediaPlaybackRequiresUserGesture(false);
            settings.setDomStorageEnabled(true);
            settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
            webView.addJavascriptInterface(new RetroExBridge(), "RetroExAndroid");
        }
    }

    private class PendingSave {
        final String filename;
        final String mimeType;
        final File tempFile;
        PendingSave(String filename, String mimeType, File tempFile) {
            this.filename = filename;
            this.mimeType = mimeType;
            this.tempFile = tempFile;
        }
    }

    private final Map<String, PendingSave> pendingSaves = new ConcurrentHashMap<>();

    private class RetroExBridge {
        @JavascriptInterface
        public String beginSaveFile(String filename, String mimeType) {
            try {
                String safeName = (filename == null || filename.trim().isEmpty())
                    ? "retroex-file.bin"
                    : new File(filename).getName().replaceAll("[^a-zA-Z0-9._-]", "_");
                String id = UUID.randomUUID().toString();
                File tmp = new File(getCacheDir(), "save_" + id + ".tmp");
                pendingSaves.put(id, new PendingSave(safeName, mimeType != null ? mimeType : "application/octet-stream", tmp));
                return id;
            } catch (Exception e) {
                return "";
            }
        }

        @JavascriptInterface
        public boolean appendSaveFile(String transferId, String base64Chunk) {
            PendingSave ps = pendingSaves.get(transferId);
            if (ps == null || base64Chunk == null) return false;
            try (FileOutputStream fos = new FileOutputStream(ps.tempFile, true)) {
                byte[] decoded = Base64.decode(base64Chunk, Base64.DEFAULT);
                fos.write(decoded);
                return true;
            } catch (Exception e) {
                return false;
            }
        }

        @JavascriptInterface
        public String finishSaveFile(String transferId) {
            JSONObject res = new JSONObject();
            PendingSave ps = pendingSaves.remove(transferId);
            if (ps == null) {
                try { res.put("ok", false); res.put("error", "Missing transfer session"); } catch (Exception ignored) {}
                return res.toString();
            }
            try {
                String savedDisplay = "Downloads/RetroEX/" + ps.filename;
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                    ContentValues values = new ContentValues();
                    values.put(MediaStore.Downloads.DISPLAY_NAME, ps.filename);
                    values.put(MediaStore.Downloads.MIME_TYPE, ps.mimeType);
                    values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/RetroEX");
                    Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                    if (uri == null) throw new Exception("MediaStore insert failed");
                    try (OutputStream out = getContentResolver().openOutputStream(uri);
                         FileInputStream in = new FileInputStream(ps.tempFile)) {
                        byte[] buf = new byte[65536];
                        int len;
                        while ((len = in.read(buf)) > 0) out.write(buf, 0, len);
                    }
                } else {
                    File dlDir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "RetroEX");
                    if (!dlDir.exists()) dlDir.mkdirs();
                    File dest = new File(dlDir, ps.filename);
                    try (FileOutputStream out = new FileOutputStream(dest);
                         FileInputStream in = new FileInputStream(ps.tempFile)) {
                        byte[] buf = new byte[65536];
                        int len;
                        while ((len = in.read(buf)) > 0) out.write(buf, 0, len);
                    }
                }
                ps.tempFile.delete();
                runOnUiThread(() -> Toast.makeText(MainActivity.this, "Saved to " + savedDisplay, Toast.LENGTH_LONG).show());
                res.put("ok", true);
                res.put("path", savedDisplay);
            } catch (Exception e) {
                ps.tempFile.delete();
                try { res.put("ok", false); res.put("error", e.getMessage()); } catch (Exception ignored) {}
            }
            return res.toString();
        }
    }
}
`;
              fs.writeFileSync(mainActPath, javaCode);
              console.log("Injected RetroExBridge into " + mainActPath);
            }
          '
          npx cap sync android

      - name: Configure upgradeable signing & version
        env:
          SIGNING_CONFIG: ${{ secrets.RETROEX_SIGNING_CONFIG || secrets.TELLYBEAM_SIGNING_CONFIG }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");

            const ksPath = "android/app/retroex-release.p12";
            let storePassword = "";
            let keyAlias = "retroex";
            let keyPassword = "";

            const rawSecret = (process.env.SIGNING_CONFIG || "").trim();
            if (rawSecret) {
              const cfg = JSON.parse(rawSecret);
              if (!cfg.keystoreB64 || !cfg.storePassword || !cfg.keyAlias) {
                throw new Error("RETROEX_SIGNING_CONFIG secret is missing required fields.");
              }
              fs.writeFileSync(ksPath, Buffer.from(cfg.keystoreB64, "base64"));
              storePassword = String(cfg.storePassword);
              keyAlias = String(cfg.keyAlias);
              keyPassword = String(cfg.keyPassword || cfg.storePassword);
              console.log("::add-mask::" + storePassword);
              console.log("::add-mask::" + keyPassword);
              execFileSync("keytool", [
                "-list",
                "-keystore", ksPath,
                "-storetype", "PKCS12",
                "-storepass", storePassword,
                "-alias", keyAlias
              ], { stdio: "inherit" });
              console.log("Loaded persistent release signing keystore.");
            } else {
              console.warn("::warning::RETROEX_SIGNING_CONFIG secret not found; generating a one-time release keystore. Future builds will require re-install unless RETROEX_SIGNING_CONFIG is set.");
              storePassword = "retroex_fallback_key";
              keyPassword = storePassword;
              execFileSync("keytool", [
                "-genkeypair", "-v",
                "-keystore", ksPath,
                "-storetype", "PKCS12",
                "-alias", keyAlias,
                "-keyalg", "RSA",
                "-keysize", "2048",
                "-validity", "10000",
                "-storepass", storePassword,
                "-keypass", keyPassword,
                "-dname", "CN=RetroEX TV, O=RetroEX, C=US"
              ], { stdio: "inherit" });
            }

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              [
                "ANDROID_STORE_PASSWORD=" + storePassword,
                "ANDROID_KEY_ALIAS=" + keyAlias,
                "ANDROID_KEY_PASSWORD=" + keyPassword
              ].join("\n") + "\n"
            );

            const runNum = Math.max(1, parseInt(process.env.RUN_NUMBER || "1", 10) || 1);
            const versionCode = 100 + runNum;
            const cleanTag = (process.env.TAG_NAME || "v1.0.0").replace(/^v/i, "") || "1.0.0";
            const versionName = cleanTag + "+" + runNum;

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, "versionCode " + versionCode);
            gradle = gradle.replace(/versionName\s+["\x27][^"\x27]*["\x27]/, "versionName " + JSON.stringify(versionName));
            gradle += "\nandroid {\n" +
              "    defaultConfig {\n" +
              "        versionCode " + versionCode + "\n" +
              "        versionName " + JSON.stringify(versionName) + "\n" +
              "    }\n" +
              "    signingConfigs {\n" +
              "        retroexRelease {\n" +
              "            storeFile file(\"retroex-release.p12\")\n" +
              "            storePassword System.getenv(\"ANDROID_STORE_PASSWORD\")\n" +
              "            keyAlias System.getenv(\"ANDROID_KEY_ALIAS\")\n" +
              "            keyPassword System.getenv(\"ANDROID_KEY_PASSWORD\")\n" +
              "            storeType \"PKCS12\"\n" +
              "        }\n" +
              "    }\n" +
              "    buildTypes {\n" +
              "        release {\n" +
              "            signingConfig signingConfigs.retroexRelease\n" +
              "        }\n" +
              "    }\n" +
              "}\n";
            fs.writeFileSync(gradlePath, gradle);
            console.log("Configured upgradeable release APK versionCode=" + versionCode + " versionName=" + versionName);
          '

      - name: Build signed Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature & prepare artifact
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="${SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          elif command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK_PATH"
          fi
          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/retroex-tv-${TAG_NAME}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: retroex-tv-apk
          path: release-assets/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}
          name: "RetroEX ${{ github.event.inputs.release_tag || github.ref_name || 'v1.0.0' }}"
          body: "Automated RetroEX Android & TV APK build from GitHub Actions."
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
